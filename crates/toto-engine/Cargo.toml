[package]
name = "toto-engine"
version = "0.1.0"
edition = "2021"
description = "Headless automation engine: scripts of clicks, keys, movement and delays run on configurable backends."
license = "MIT OR Apache-2.0"

[lib]
name = "toto_engine"
path = "src/lib.rs"

[features]
default = ["enigo-backend"]
enigo-backend = ["dep:enigo"]

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
log = "0.4"
enigo = { version = "0.6.1", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Media"] }

[dev-dependencies]
serde_json = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "sleep_accuracy"
harness = false
